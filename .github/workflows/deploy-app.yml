# Deploys the Rota Livre web app (hackathon/app/) to Cloudflare on every push to main that changes it.
# Live at https://accessible-routes.benlubetzky.workers.dev. Needs the repository secret CLOUDFLARE_API_TOKEN
# (a Cloudflare API token from the "Edit Cloudflare Workers" template); the account ID is in wrangler.jsonc.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "hackathon/app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push replaces a deploy that is still running.
concurrency:
  group: deploy-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: hackathon/app
          command: deploy
