# Team O(1/n)'s local Coreflux environment: broker + HUB + Mailpit (test email inbox).
#
#   docker compose up -d       starts everything
#   docker compose down        stops (broker data stays in the broker-data volume)
#   docker compose down -v     stops and WIPES the broker (including the activated licence!)
#
# HUB:     http://localhost:3000  (connection: host "broker", port 1883, root / coreflux)
# Mailpit: http://localhost:8025  (the broker sends to mailpit:1025 inside Docker)
# Health:  http://localhost:9100/health
# MCP:     http://localhost:6278/mcp  (AI agents deploy/inspect LoT; bearer token, see ../AI.md)
#
# Security: other teams share the FCUP network. By default every port is bound to
# 127.0.0.1 only. For a device (Arduino/ESP32) or a teammate's laptop to reach MQTT,
# set MQTT_BIND=0.0.0.0 in .env and change the root password first (see README).
#
# Event licence: put COREFLUX_ACTIVATION_CODE=CFLX-... in hackathon/broker/.env
# before the first `up`, or use -activateLicense in the HUB Command Console.
services:
  broker:
    image: ${BROKER_IMAGE:-coreflux/coreflux-mqtt-broker:2.22.0}
    container_name: o1n-broker
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-127.0.0.1}:1883:1883"   # MQTT (VS Code, paho-mqtt, mosquitto_pub/sub)
      - "127.0.0.1:9100:9100"   # health
      - "127.0.0.1:6278:6278"   # MCP server (Claude Code / Cursor); never expose beyond localhost
    volumes:
      - broker-data:/etc/project
      - ./templates:/templates:ro   # HTML templates for EMAIL Connectors
      - ./exports:/data/exports     # files written by FILE_STORAGE Connectors
      - ../lot:/lot:ro              # our .lotnb notebooks (git = source of truth), see ../AI.md
    environment:
      - COREFLUX_ACTIVATION_CODE=${COREFLUX_ACTIVATION_CODE:-}
      # MCP listener: inside the container it must bind 0.0.0.0 (the container's own
      # 127.0.0.1 is unreachable from the host); the port mapping above keeps it on localhost.
      - COREFLUX_MCP_ENABLED=true
      - COREFLUX_MCP_BIND_IP=0.0.0.0

  hub:
    image: ${HUB_IMAGE:-coreflux/coreflux-hub:2.12.0}
    container_name: o1n-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The HUB runs inside Docker: it reaches the broker by service name, not localhost
      - HUB_DEFAULT_CONNECTION_NAME=O(1/n)
      - HUB_DEFAULT_CONNECTION_HOST=broker
      - HUB_DEFAULT_CONNECTION_PROTOCOL=mqtt
      - HUB_DEFAULT_CONNECTION_PORT=1883
    volumes:
      - hub-data:/opt/coreflux-hub/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: o1n-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

volumes:
  broker-data:
  hub-data:
