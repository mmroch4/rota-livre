name: rota-livre-routing
services:
  valhalla:
    image: rota-livre-valhalla:618cad5
    container_name: rota-livre-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8002"
    volumes:
      - ./data:/data/valhalla:ro
    entrypoint: ["valhalla_service"]
    command: ["/data/valhalla/valhalla.json", "2"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "3", "http://127.0.0.1:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
