 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({privateContent:{yaw:Number(yaw.value),pitch:Number(pitch.value)}}).catch(()=>{});}
 yaw.oninput=pitch.oninput=draw;yaw.onchange=pitch.onchange=save;
 let drag=null;

 canvas.onpointerup=()=>{drag=null;save();};canvas.onpointercancel=()=>{drag=null;};

})();
