; Projeto Arduino Uno: 1 botão, 2 motores DC (via ponte H L298N), 1 servo 180º
;
;   pio run -e uno              -> compila o firmware
;   pio run -e uno -t upload    -> envia para a placa
;   pio device monitor          -> monitor Serial (9600 baud)
;   pio test -e native          -> testes unitários da lógica no PC

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.2
monitor_speed = 9600
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
