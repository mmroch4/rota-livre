; Arduino Uno hanging scoop: start button, DC winch (L298N, both channels), one 180° servo
;
;   pio run -e uno              -> build the firmware
;   pio run -e uno -t upload    -> flash the board
;   pio device monitor          -> Serial monitor (9600 baud)
;   pio test -e native          -> unit tests of the logic on the PC

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.2
monitor_speed = 9600
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
